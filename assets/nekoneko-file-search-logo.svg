    <text x="0" y="94" font-family="Georgia, 'Hiragino Mincho ProN', serif" font-size="58" font-weight="700">File Search Demo</text>
    <text x="2" y="144" font-family="ui-sans-serif, 'Hiragino Sans', sans-serif" font-size="24" font-weight="700" fill="#49615c">multimodal RAG with images, documents, metadata filters, and citations</text>
  </g>
