<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Nekoneko File Search Demo</title>
  <desc id="desc">A flat geometric logo for a multimodal file search demo with document, image, and citation symbols.</desc>
  <rect width="960" height="360" rx="0" fill="#f4efe2"/>
  <path d="M0 288 L960 238 L960 360 L0 360Z" fill="#c9d8d3"/>
  <g transform="translate(80 70)">
    <rect x="0" y="0" width="190" height="190" rx="24" fill="#fff8e9" stroke="#1d211d" stroke-width="10"/>
    <path d="M44 52 h82 l30 30 v72 H44Z" fill="#e7d775" stroke="#1d211d" stroke-width="8"/>
    <path d="M126 52 v34 h34" fill="none" stroke="#1d211d" stroke-width="8"/>
    <circle cx="76" cy="124" r="18" fill="#4b89dc"/>
    <path d="M118 124 l34 -22 v44Z" fill="#4b89dc"/>
    <path d="M58 162 h92" stroke="#1d211d" stroke-width="10"/>
  </g>
  <g transform="translate(330 90)" fill="#1d211d">
